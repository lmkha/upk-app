name: PR checks

# Runs on every pull request targeting main or develop.
# No `paths` filter on purpose: if this job is marked as a required status check,
# a skipped run would leave the pull request waiting forever.
on:
  pull_request:
    branches:
      - main
      - develop

# A new push to the same pull request cancels the run that is still in progress.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Branch protection requires a status check with this exact name; do not rename the job.
    name: Unit tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull requests are always verified against the develop environment (dev flavor).
    # Secrets are not passed to pull requests opened from forks, so this job
    # only works for branches pushed to this repository.
    environment: develop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      # local.properties is the base file the secrets Gradle plugin reads for every flavor.
      # Each job builds one environment, so the whole properties file of that environment
      # is written straight into local.properties.
      - name: Generate local.properties from environment secrets
        env:
          PROPERTIES: ${{ secrets.PROPERTIES }}
        run: |
          if [ -z "${PROPERTIES}" ]; then
            echo "PROPERTIES is not set for the develop environment." >&2
            exit 1
          fi
          printf '%s\n' "${PROPERTIES}" >> local.properties

      - name: Generate google-services.json from environment secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "GOOGLE_SERVICES_JSON is not set for the develop environment." >&2
            exit 1
          fi
          printf '%s\n' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      # Every module has the dev / staging / prod flavors, so one task name covers the whole project.
      - name: Run unit tests
        run: ./gradlew testDevDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDevDebug

      # Instrumented tests need an emulator, so they are only compiled here.
      - name: Build debug APK and compile instrumented tests
        run: ./gradlew :app:assembleDevDebug assembleDevDebugAndroidTest

      - name: Upload test and lint reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
