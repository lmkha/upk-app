name: PR checks

# Runs on every pull request targeting main.
# No `paths` filter on purpose: if this job is marked as a required status check,
# a skipped run would leave the pull request waiting forever.
on:
  pull_request:
    branches:
      - main

# A new push to the same pull request cancels the run that is still in progress.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Branch protection requires a status check with this exact name; do not rename the job.
    name: Unit tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull requests are always verified against the develop environment.
    # Secrets are not passed to pull requests opened from forks, so this job
    # only works for branches pushed to this repository.
    environment: develop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v5

      # secrets.properties is the file the secrets Gradle plugin and app/build.gradle.kts read.
      # The SECRETS_PROPERTIES secret holds the whole file of the develop environment. ENVIRONMENT is
      # appended here so it always matches the GitHub Environment this job runs in.
      - name: Generate secrets.properties from environment secrets
        env:
          SECRETS_PROPERTIES: ${{ secrets.SECRETS_PROPERTIES }}
        run: |
          if [ -z "${SECRETS_PROPERTIES}" ]; then
            echo "SECRETS_PROPERTIES is not set for the develop environment." >&2
            exit 1
          fi
          printf '%s\n' "${SECRETS_PROPERTIES}" > secrets.properties
          echo "ENVIRONMENT=dev" >> secrets.properties

      - name: Generate google-services.json from environment secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "GOOGLE_SERVICES_JSON is not set for the develop environment." >&2
            exit 1
          fi
          printf '%s\n' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      # Instrumented tests need an emulator, so they are only compiled here.
      # compileDebugAndroidTestKotlin stops before dexing and packaging: no test APK is ever installed on CI.
      - name: Build debug APK and compile instrumented tests
        run: ./gradlew :app:assembleDebug compileDebugAndroidTestKotlin

      - name: Upload test and lint reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
