name: PR checks

# Runs on every pull request targeting main or develop.
# No `paths` filter on purpose: if this job is marked as a required status check,
# a skipped run would leave the pull request waiting forever.
on:
  pull_request:
    branches:
      - main
      - develop

# A new push to the same pull request cancels the run that is still in progress.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      # Secrets are not passed to pull requests opened from forks, so this job
      # only works for branches pushed to this repository.
      - name: Generate local.properties and google-services.json from GitHub Secrets
        env:
          API_URL: ${{ secrets.API_URL }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "API_URL=\"${API_URL}\"" >> local.properties
          echo "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      # Instrumented tests need an emulator, so they are only compiled here.
      - name: Build debug APK and compile instrumented tests
        run: ./gradlew :app:assembleDebug assembleDebugAndroidTest

      - name: Upload test and lint reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr-check-reports
          path: |
            **/build/reports/tests/testDebugUnitTest/
            **/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
