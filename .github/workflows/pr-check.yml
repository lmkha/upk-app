name: PR checks

# Runs on every pull request targeting main.
# No `paths` filter on purpose: if this job is marked as a required status check,
# a skipped run would leave the pull request waiting forever.
on:
  pull_request:
    branches:
      - main

# A new push to the same pull request cancels the run that is still in progress.
concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Branch protection requires a status check with this exact name; do not rename the job.
    name: Unit tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull requests are always verified against the develop environment.
    # Secrets are not passed to pull requests opened from forks, so this job
    # only works for branches pushed to this repository.
    environment: develop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v5

      # This job always runs in the develop GitHub Environment (see "environment:" above), so its
      # secrets are those of secrets/dev/. ENVIRONMENT=dev is written here, never read from the
      # secret: SECRETS_PROPERTIES holds the same content as secrets/dev/secrets.properties.
      - name: Write secrets.properties and google-services.json
        env:
          APP_ENVIRONMENT: dev
          SECRETS_PROPERTIES: ${{ secrets.SECRETS_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          for name in SECRETS_PROPERTIES GOOGLE_SERVICES_JSON; do
            if [ -z "${!name}" ]; then
              echo "${name} is not set for the develop environment." >&2
              exit 1
            fi
          done
          if grep -Eq '^[[:space:]]*ENVIRONMENT([[:space:]=:]|$)' <<< "${SECRETS_PROPERTIES}"; then
            echo "Remove the ENVIRONMENT line from the SECRETS_PROPERTIES secret of the develop environment: the workflow sets it." >&2
            exit 1
          fi
          {
            echo "# Generated by CI from the SECRETS_PROPERTIES secret of the develop environment."
            echo "ENVIRONMENT=${APP_ENVIRONMENT}"
            printf '%s\n' "${SECRETS_PROPERTIES}"
          } > secrets.properties
          printf '%s\n' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      # Instrumented tests need an emulator, so they are only compiled here.
      # compileDebugAndroidTestKotlin stops before dexing and packaging: no test APK is ever installed on CI.
      - name: Build debug APK and compile instrumented tests
        run: ./gradlew :app:assembleDebug compileDebugAndroidTestKotlin

      - name: Upload test and lint reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
