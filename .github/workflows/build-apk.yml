name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      run_tests:
        description: "Run unit tests before building APK"
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Generate local.properties and google-services.json from GitHub Secrets
        env:
          API_URL: ${{ secrets.API_URL }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "API_URL=\"${API_URL}\"" >> local.properties
          echo "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Run Unit Tests
        if: ${{ inputs.run_tests }}
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew :app:assembleDebug

      - name: Build Release APK
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew :app:assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upk-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 14