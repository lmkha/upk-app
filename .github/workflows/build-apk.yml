name: Build APK

# Builds the APK of one environment. Each GitHub Environment (develop, staging,
# production) owns its own SECRETS_PROPERTIES and GOOGLE_SERVICES_JSON secrets.
#
#   push to develop  -> develop environment
#   push to main     -> production environment
#   manual run       -> the environment picked in the dropdown
on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - staging
          - production
      run_tests:
        description: "Run unit tests before building APK"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Selects which environment's secrets are used. Protection rules configured
    # on the environment (required reviewers, allowed branches) apply to this job.
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The environment decides the build type (debug for develop, release for staging/production).
      - name: Resolve build variant
        id: variant
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}
        run: |
          case "${TARGET_ENVIRONMENT}" in
            develop)
              app_environment=dev
              build_type=debug
              assemble_task=":app:assembleDebug"
              ;;
            staging)
              app_environment=staging
              build_type=release
              assemble_task=":app:assembleRelease"
              ;;
            production)
              app_environment=prod
              build_type=release
              assemble_task=":app:assembleRelease"
              ;;
            *)
              echo "Unknown environment: ${TARGET_ENVIRONMENT}" >&2
              exit 1
              ;;
          esac
          {
            echo "environment=${TARGET_ENVIRONMENT}"
            echo "app_environment=${app_environment}"
            echo "build_type=${build_type}"
            echo "assemble_task=${assemble_task}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v5

      # secrets.properties is the file the secrets Gradle plugin and app/build.gradle.kts read.
      # The SECRETS_PROPERTIES secret holds the whole file of the selected environment. ENVIRONMENT is
      # appended here so it always matches the GitHub Environment this job runs in.
      - name: Generate secrets.properties from environment secrets
        env:
          SECRETS_PROPERTIES: ${{ secrets.SECRETS_PROPERTIES }}
          APP_ENVIRONMENT: ${{ steps.variant.outputs.app_environment }}
        run: |
          if [ -z "${SECRETS_PROPERTIES}" ]; then
            echo "SECRETS_PROPERTIES is not set for this environment." >&2
            exit 1
          fi
          printf '%s\n' "${SECRETS_PROPERTIES}" > secrets.properties
          echo "ENVIRONMENT=${APP_ENVIRONMENT}" >> secrets.properties

      - name: Generate google-services.json from environment secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "GOOGLE_SERVICES_JSON is not set for this environment." >&2
            exit 1
          fi
          printf '%s\n' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Run unit tests
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew ${{ steps.variant.outputs.assemble_task }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: upk-${{ steps.variant.outputs.environment }}-${{ steps.variant.outputs.build_type }}-apk
          path: app/build/outputs/apk/${{ steps.variant.outputs.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 14
