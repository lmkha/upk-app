name: Build APK

# Builds the APK of one environment. Each GitHub Environment (develop, staging,
# production) owns its own PROPERTIES and GOOGLE_SERVICES_JSON secrets.
#
#   push to develop  -> develop environment
#   push to main     -> production environment
#   manual run       -> the environment picked in the dropdown
on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - staging
          - production
      run_tests:
        description: "Run unit tests before building APK"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Selects which environment's secrets are used. Protection rules configured
    # on the environment (required reviewers, allowed branches) apply to this job.
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The environment decides the build type (debug for develop, release for staging/production).
      - name: Resolve build variant
        id: variant
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || (github.ref_name == 'main' && 'production' || 'develop') }}
        run: |
          case "${TARGET_ENVIRONMENT}" in
            develop)
              build_type=debug
              assemble_task=":app:assembleDebug"
              ;;
            staging|production)
              build_type=release
              assemble_task=":app:assembleRelease"
              ;;
            *)
              echo "Unknown environment: ${TARGET_ENVIRONMENT}" >&2
              exit 1
              ;;
          esac
          {
            echo "environment=${TARGET_ENVIRONMENT}"
            echo "build_type=${build_type}"
            echo "assemble_task=${assemble_task}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      # local.properties is the file the secrets Gradle plugin and app/build.gradle.kts read.
      # Each job builds one environment, so the whole properties file of that environment
      # is written straight into local.properties.
      - name: Generate local.properties from environment secrets
        env:
          PROPERTIES: ${{ secrets.PROPERTIES }}
        run: |
          if [ -z "${PROPERTIES}" ]; then
            echo "PROPERTIES is not set for this environment." >&2
            exit 1
          fi
          printf '%s\n' "${PROPERTIES}" >> local.properties

      - name: Generate google-services.json from environment secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "GOOGLE_SERVICES_JSON is not set for this environment." >&2
            exit 1
          fi
          printf '%s\n' "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Run unit tests
        if: ${{ github.event_name == 'push' || inputs.run_tests }}
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew ${{ steps.variant.outputs.assemble_task }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: upk-${{ steps.variant.outputs.environment }}-${{ steps.variant.outputs.build_type }}-apk
          path: app/build/outputs/apk/${{ steps.variant.outputs.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 14
