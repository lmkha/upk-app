name: Build APK

# Builds the APK of one environment. Each GitHub Environment (develop, staging,
# production) owns its own SECRETS_PROPERTIES and GOOGLE_SERVICES_JSON secrets.
#
#   push to main                  -> develop environment (debug APK artifact)
#   push tag v*.*.*-* (e.g. -rc.1)-> staging environment (release APK + GitHub Pre-release)
#   push tag v*.*.*               -> production environment (release APK + GitHub Release)
#   manual run                    -> the environment picked in the dropdown
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - staging
          - production
      run_tests:
        description: "Run unit tests before building APK"
        required: true
        default: true
        type: boolean

# A newer push to main cancels the dev build that is still in progress, so only
# the latest commit is built. Tag builds and manual runs are never cancelled: a
# second run of the same tag, or of the same manual target, waits for the first.
concurrency:
  group: build-apk-${{ github.ref }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    # One-entry matrix, not a real fan-out: the target GitHub Environment is computed once
    # here and read as matrix.environment below. A workflow-level "env:" value cannot do
    # this, because the env context is not available in "name:" and "environment:".
    strategy:
      matrix:
        environment:
          - ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-') && 'staging' || 'production') || 'develop') }}
    name: Build ${{ matrix.environment }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Selects which environment's secrets are used. Protection rules configured
    # on the environment (required reviewers, allowed branches/tags) apply to this job.
    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The GitHub Environment of the job decides the ENVIRONMENT value written to
      # secrets.properties and the build type.
      - name: Resolve build variant
        id: variant
        env:
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          case "${TARGET_ENVIRONMENT}" in
            develop)
              app_environment=dev
              build_type=debug
              assemble_task=":app:assembleDebug"
              ;;
            staging)
              app_environment=staging
              build_type=release
              assemble_task=":app:assembleRelease"
              ;;
            production)
              app_environment=prod
              build_type=release
              assemble_task=":app:assembleRelease"
              ;;
            *)
              echo "Unknown environment: ${TARGET_ENVIRONMENT}" >&2
              exit 1
              ;;
          esac
          {
            echo "environment=${TARGET_ENVIRONMENT}"
            echo "app_environment=${app_environment}"
            echo "build_type=${build_type}"
            echo "assemble_task=${assemble_task}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v5

      # ENVIRONMENT is written by the script from the GitHub Environment of the job, never read from
      # the secret: SECRETS_PROPERTIES holds the same content as secrets/<environment>/secrets.properties.
      # pr-check.yml runs the same script.
      - name: Write secrets.properties and google-services.json
        env:
          TARGET_ENVIRONMENT: ${{ steps.variant.outputs.environment }}
          APP_ENVIRONMENT: ${{ steps.variant.outputs.app_environment }}
          SECRETS_PROPERTIES: ${{ secrets.SECRETS_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/write-env-files.sh

      # Release builds (staging, production) are signed with the keystore of their GitHub
      # Environment. It is decoded into the runner's temp folder, outside the repository.
      # app/build.gradle.kts reads its path and passwords from the UPK_RELEASE_* variables
      # set on the "Build APK" step, and stops a release build when one is missing.
      - name: Decode release keystore
        id: signing
        if: ${{ steps.variant.outputs.build_type == 'release' }}
        env:
          TARGET_ENVIRONMENT: ${{ steps.variant.outputs.environment }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "${name} is not set for the ${TARGET_ENVIRONMENT} environment." >&2
              exit 1
            fi
          done
          keystore_file="${RUNNER_TEMP}/release-keystore.jks"
          base64 --decode <<< "${RELEASE_KEYSTORE_BASE64}" > "${keystore_file}"
          echo "keystore_file=${keystore_file}" >> "${GITHUB_OUTPUT}"

      # Run unit tests (when enabled) and build the APK in a single Gradle invocation.
      # The signing variables are empty for a develop build, which is a debug build.
      - name: Run tests and build APK
        env:
          RUN_TESTS: ${{ github.event_name == 'push' || inputs.run_tests }}
          ASSEMBLE_TASK: ${{ steps.variant.outputs.assemble_task }}
          UPK_RELEASE_KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_file }}
          UPK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          UPK_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          UPK_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          tasks=()
          if [ "${RUN_TESTS}" = "true" ]; then
            tasks+=(testDebugUnitTest)
          fi
          tasks+=("${ASSEMBLE_TASK}")
          ./gradlew "${tasks[@]}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: upk-${{ steps.variant.outputs.environment }}-${{ steps.variant.outputs.build_type }}-apk
          path: app/build/outputs/apk/${{ steps.variant.outputs.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          ENVIRONMENT: ${{ steps.variant.outputs.environment }}
        run: |
          apk_file="upk-${TAG_NAME}.apk"
          cp app/build/outputs/apk/release/*.apk "${apk_file}"
          prerelease_flag=()
          if [ "${ENVIRONMENT}" = "staging" ]; then
            prerelease_flag=(--prerelease)
          fi
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "${apk_file}" --clobber
          else
            gh release create "${TAG_NAME}" "${apk_file}" \
              --title "${TAG_NAME}" \
              --generate-notes \
              "${prerelease_flag[@]}"
          fi
